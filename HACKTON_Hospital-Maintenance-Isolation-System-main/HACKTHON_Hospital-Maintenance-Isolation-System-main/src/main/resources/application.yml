server:
  port: 8080

spring:
  application:
    name: hospital-maintenance-isolation-system
  datasource:
    url: jdbc:h2:mem:hospitaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    # 256-bit hexadecimal / base64 secret key for HMAC-SHA256
    secret: 9a4f2c8d3e7b1a5f6c8d2e4a7b9c1d3e5f7a2b4c6d8e0f1a3b5c7d9e1f3a5b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3
    expiration-ms: 86400000 # 24 hours
